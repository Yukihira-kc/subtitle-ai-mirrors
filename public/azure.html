const editor=$('pool');
let composing=false,confirmedValue='',marks=[],pending=[],editStart=0;
function appendPending(){
 if(composing||!pending.length)return;
 const text=pending.map(item=>item.text).join('');
 const start=editor.selectionStart,stop=editor.selectionEnd,direction=editor.selectionDirection;
 editor.setRangeText(text,editor.value.length,editor.value.length,'preserve');
 editor.setSelectionRange(start,stop,direction);
 for(const item of pending)for(let i=0;i<item.text.length;i++)marks.push(item.range);
 pending=[];confirmedValue=editor.value;draw()
}
function syncEdit(){
 const old=confirmedValue,value=editor.value;
 if(old===value)return;
 let a=0;
 while(a<editStart&&a<old.length&&a<value.length&&old[a]===value[a])a++;
 let b=old.length,c=value.length;
 while(b>a&&c>a&&old[b-1]===value[c-1]){b--;c--}
 protect(marks.slice(0,b));
 const replaced=marks.slice(a,b).filter(Boolean);
 const range=replaced.length?replaced[0]===replaced.at(-1)?replaced[0]:{get begin(){return replaced[0].begin},get finish(){return replaced.at(-1).finish},approx:true}:null;
 const insertion=Array.from({length:c-a},(_,i)=>value[a+i]==='\n'?null:range);
 marks=marks.slice(0,a).concat(insertion,marks.slice(b));confirmedValue=value;draw()
}
editor.onbeforeinput=()=>{if(!composing)editStart=editor.selectionStart};
editor.oninput=()=>{if(!composing)syncEdit()};
editor.addEventListener('compositionstart',()=>{editStart=editor.selectionStart;composing=true;draw()});
editor.addEventListener('compositionend',()=>{composing=false;syncEdit();for(const args of deferred.splice(0))receive(...args);appendPending();draw()});
$('cut').onclick=()=>{
 if(composing)return;
 syncEdit();
 const match=/^(?:[^\S\n]*\n)*([^\n]*\S[^\n]*)(?:\n|$)/.exec(editor.value);
 if(!match)return;
 const text=match[1],length=match[0].length,offset=match[0].indexOf(text);
 const ranges=marks.slice(offset,offset+text.length).filter(Boolean);
 const box={id:boxes.length+1,text,ranges,utterance,owner:null,sent:false};
 boxes.push(box);
 if(!boxAudio(box)){boxes.pop();return;}
 protect(ranges);
 const a=Math.max(0,editor.selectionStart-length),b=Math.max(0,editor.selectionEnd-length);
 editor.setRangeText('',0,length,'start');editor.setSelectionRange(a,b);
 marks.splice(0,length);confirmedValue=editor.value;draw();editor.focus()
};
let rate=16000,pcm=[],total=0;
let context,mic,sourceNode,processor,push,recognizer,recording=false,stopping=false;
let currentRun=null;
const sdkCall=(method)=>new Promise((resolve,reject)=>method(resolve,reject));
const status=(message)=>{$('status').textContent=message};
const credentials = {

 S0: {region:'', key:'', configured:false}
};
const speechKeyLink=$('speech-key-link');
const speechPortalList=speechKeyLink.href;
let speechKeysByTier={};
function showSpeechKeyLink(){

 speechKeyLink.textContent=selectedTier+'のAPIキーを確認';
}
let selectedTier='F0', confirmedCredentials=null;
if(location.hash==='#select-s0'){
 const target=new URL(location.href);target.hash='';
 history.replaceState(history.state,'',target);
 const intentKey=SubtitleConnection.storageKey('open-s0');
 try{
  if(sessionStorage.getItem(intentKey)==='1')selectedTier='S0';
  sessionStorage.removeItem(intentKey);
 }catch{
  // Private storage may be unavailable. Allow the choice from the same desk page.
  if(document.referrer){
   const previous=new URL(document.referrer);
   if(previous.origin===target.origin && previous.pathname==='/desk.html' &&
      previous.searchParams.get('room')===target.searchParams.get('room'))selectedTier='S0';
  }
 }
}
function safeError(error,key){

}
const regionValue=()=>credentials[selectedTier].region || 'japaneast';
function keyValue(){
 const fields=credentials[selectedTier];
 if(fields.configured && $('key').value==='')return fields.key;

}
function showKey(){
 const fields=credentials[selectedTier];
 $('key').value=fields.configured?'':fields.key;
 $('key').placeholder=fields.configured?'設定済み（変更は再入力）':'';
 $('clear-key').hidden=!fields.configured;
}
function clearConfirmation(){
 confirmedCredentials=null;
 $('tier-confirm').checked=false;
}
function showTier(){
 const paid=selectedTier==='S0', name=paid?'Standard S0':'Free F0';
 $('engine').value=selectedTier;
 showKey();showSpeechKeyLink();
 $('tier-confirm-label').textContent='Azureでこのキーのリソースが'+name+'であることを確認した';
 $('start').textContent=paid?'S0で有料認識を開始':'F0で認識開始';
 $('diag').textContent=paid?'Standard S0のキーで認識すると、音声時間に応じて課金されます。':'Free F0のキーで無料枠を使用します。';
}
function lockResource(locked){
 for(const id of ['key','clear-key','tier-confirm'])$(id).disabled=locked;
}
$('engine').onchange=()=>{
 const picker=$('engine');
 if(currentRun || stopping || picker.disabled){picker.value=selectedTier;return;}
 if(picker.value==='vosk'){switchEngine(selectedTier);return;}
 selectedTier=picker.value;
 clearConfirmation();showTier();status('');
};
function configureSpeechRegions(snapshot){
 speechKeysByTier=snapshot.azureSpeechKeyLinks || {};
 showSpeechKeyLink();
 for(const [tier,fields] of Object.entries(credentials)){
  const region=snapshot.azureSpeechRegions?.[tier] || 'japaneast';
  if(fields.region && fields.region!==region){
   fields.key='';fields.configured=false;
   SpeechUsage.reset(tier,false);
   if(tier===selectedTier){
    showKey();clearConfirmation();
    status('Speech設定が更新されました。このプランのキーを入力してください。');
   }
  }
  fields.region=region;
 }
}
$('key').oninput=()=>{
 const fields=credentials[selectedTier];
 fields.key=$('key').value.trim();fields.configured=false;
 $('key').placeholder='';$('clear-key').hidden=true;
 clearConfirmation();
 SpeechUsage.reset(selectedTier, fields.key);
};
$('clear-key').onclick=()=>{
 const fields=credentials[selectedTier];
 fields.key='';fields.configured=false;
 SpeechUsage.reset(selectedTier, false);
 showKey();clearConfirmation();$('key').focus();status('Speechキーを消去しました。');
};
$('tier-confirm').onchange=()=>{
 confirmedCredentials=$('tier-confirm').checked
  ? {tier:selectedTier,region:regionValue(),key:keyValue()}
  : null;
 const key=keyValue();
 if(confirmedCredentials && /^[a-z0-9]+$/.test(regionValue()) && key && !tierKeyConflict(key)){
  SpeechUsage.verify(selectedTier,key);
 }else{
  SpeechUsage.reset(selectedTier, key);
 }
};
function tierKeyConflict(key){
 const fields=credentials[selectedTier],other=credentials[selectedTier==='F0'?'S0':'F0'];
 return other.key===key && (!fields.configured || other.configured);
}
clearConfirmation();showTier();
$('devices').onclick=async()=>{
 try{
  const permission=await navigator.mediaDevices.getUserMedia({audio:true});
  try{
   const inputs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput'&&d.deviceId!=='default');
   $('device').replaceChildren(new Option('Windows の既定',''),...inputs.map((d,i)=>new Option(d.label||'入力 '+(i+1),d.deviceId)));
  }finally{permission.getTracks().forEach(t=>t.stop())}
 }catch(e){status('入力機器を取得できませんでした。'+e.message)}
};
function release(){
 recording=false;
 if(processor){processor.onaudioprocess=null;processor.disconnect()}
 if(mic)mic.getTracks().forEach(t=>{t.onended=null;t.stop()});
 if(sourceNode)sourceNode.disconnect();
 if(context&&context.state!=='closed')context.close().catch(()=>{});
 $('level').value=0;$('stop').disabled=true;
}
async function stop(message){
 if(stopping)return;
 const runKey=currentRun?.key || credentials[selectedTier].key;
 stopping=true;release();status('認識を終了中');
 try{
  push?.close();
  if(recognizer){
   await Promise.race([sdkCall((ok,error)=>recognizer.stopContinuousRecognitionAsync(ok,error)),new Promise(resolve=>setTimeout(resolve,4000))]);
  }
 }catch(e){
  message='認識終了時のエラー '+safeError(e,runKey);
 }
 finally{
  currentRun=null;
  try{recognizer?.close()}catch(e){
   message=message||'認識終了時のエラー '+safeError(e,runKey);
  }finally{
   recognizer=null;push=null;processor=null;sourceNode=null;mic=null;context=null;
   receive(null,true);
   stopping=false;lockResource(false);
   showKey();
   setDeskRecognitionBusy(false);
   $('partial').textContent='入力待ち';status(message||'認識終了')
  }
 }
}
function ticks(value){return Number(value)/10000000}
let hypothesis='',refs=[],locked=0,utterance=1;
const deferred=[];
function protect(ranges){
 for(const r of ranges){const i=refs.indexOf(r);if(i>=0)locked=Math.max(locked,i+1)}
}
function boxAudio(box){
 // A complete-AI box keeps the same WAV that the desk released with F12.
 if(box.forReview)return true;
 const prior=boxes[boxes.indexOf(box)-1];
 const valid=box.ranges.filter(r=>Number.isFinite(r.begin)&&r.finish>r.begin);
 const previousBegin=box.begin,previousFinish=box.finish,previousApprox=box.approx;
 box.begin=Math.max(prior?.finish||0,valid[0]?.begin||0);
 box.finish=Math.max(box.begin,valid.at(-1)?.finish||0);
 box.approx=valid.some(r=>r.approx);
 const endSample=Math.min(total,Math.round(box.finish*rate));
 if(box.begin===previousBegin && box.finish===previousFinish && box.approx===previousApprox && box.endSample===endSample)return true;
 box.endSample=endSample;
 box.audio=box.finish>box.begin?clip(box.begin,box.finish):null;
 return publishBox(box)
}
function receive(result,final,base=0){
 if(composing){deferred.push([result,final,base]);return}
 if(!result){
  // A stopped run can end on an interim hypothesis. Keep its text and timing references.
  if(hypothesis && editor.value && !editor.value.endsWith('\n'))pending.push({text:'\n',range:null});
  hypothesis='';refs=[];locked=0;utterance++;appendPending();draw();return
 }
 const text=result.text||'';
 if(!text&&!final)return;

 while(prefix<Math.min(text.length,hypothesis.length)&&text[prefix]===hypothesis[prefix])prefix++;
 while(suffix<Math.min(text.length,hypothesis.length)-prefix&&text.at(-1-suffix)===hypothesis.at(-1-suffix))suffix++;
 const oldEnd=hypothesis.length-suffix,newEnd=text.length-suffix;
 function mapped(i){
  if(i<=prefix)return i;
  if(i>=oldEnd)return i+newEnd-oldEnd;

 const times=Array.from({length:text.length},(_,i)=>({begin:start+(stop-start)*i/text.length,finish:start+(stop-start)*(i+1)/text.length,approx:true}));
 let words=[];
 try{words=JSON.parse(result.json).NBest?.[0]?.Words||[]}catch{}
 let cursor=0;
 for(const w of words){
  const pos=text.indexOf(w.Word,cursor);if(pos<0||!w.Word.length)continue;
  const t=base+ticks(w.Offset),duration=ticks(w.Duration);
  for(let n=0;n<w.Word.length;n++)times[pos+n]={begin:t+duration*n/w.Word.length,finish:t+duration*(n+1)/w.Word.length,anchor:true,approx:w.Word.length>1};
  cursor=pos+w.Word.length
 }
 // Interpolate unmatched display characters only between adjacent word anchors.
 let edge=start,left=0;
 for(let i=0;i<=times.length;i++){
  if(i<times.length&&times[i].anchor!==true)continue;

  for(let j=left;j<i;j++){times[j].begin=edge+(right-edge)*(j-left)/(i-left);times[j].finish=edge+(right-edge)*(j+1-left)/(i-left)}

 }

 const cutIndex=mapped(keep);
 for(let i=0;i<oldRefs.length;i++){
  const a=mapped(i),b=mapped(i+1);
  if(times[a]&&b>a)Object.assign(oldRefs[i],{begin:times[a].begin,finish:times[b-1].finish,approx:times[a].approx||times[b-1].approx})
 }

 let tail=marks.length;
 while(tail&&stale.has(marks[tail-1]))tail--;
 const caret=editor.selectionStart,sel=editor.selectionEnd,dir=editor.selectionDirection;
 const remainder=text.slice(cutIndex);
 const rest=final&&!editor.value&&cutIndex>0&&/^[。！？、,.!?]+$/.test(remainder)?'':remainder;
 editor.setRangeText(rest,tail,editor.value.length,'preserve');
 editor.setSelectionRange(Math.min(caret,editor.value.length),Math.min(sel,editor.value.length),dir);

 refs=times.map((r,i)=>i<prefix?oldRefs[i]:r);

}
document.addEventListener('keydown',e=>{
 if(role!=='デスク'||e.key!=='F12')return;
 e.preventDefault();e.stopPropagation();
 if(!e.repeat&&!composing&&!e.isComposing&&e.keyCode!==229)$('cut').click()
},true);
$('start').onclick=async()=>{
 if($('start').disabled)return;
 const region=regionValue(),key=keyValue();
 if(!/^[a-z0-9]+$/.test(region)){status('サーバーのSpeechリージョン設定を確認してください。');return}
 if(!key){status('選択したプランのSpeechキーを入力してください。');return}
 if(!$('tier-confirm').checked || confirmedCredentials?.tier!==selectedTier ||
    confirmedCredentials.region!==region || confirmedCredentials.key!==key){
  clearConfirmation();status('このキーの料金レベルをAzureで確認し、チェックを入れてください。');return
 }
 const fields=credentials[selectedTier];
 if(tierKeyConflict(key)){
  status('F0とS0に同じキーが設定されています。Azureで選択したリソースのキーを確認してください。');return
 }
 if(!window.SpeechSDK){status('Speech SDK の読み込みに失敗しました。');return}
 fields.region=region;fields.key=key;

 setDeskRecognitionBusy(true);status('マイクと Azure に接続中');
 try{
  context=new AudioContext();await context.resume();
  mic=await navigator.mediaDevices.getUserMedia({audio:$('device').value?{deviceId:{exact:$('device').value}}:true});
  SpeechSDK.Recognizer.enableTelemetry(false);
  const config=SpeechSDK.SpeechConfig.fromSubscription(key,region);
  config.speechRecognitionLanguage='ja-JP';config.outputFormat=SpeechSDK.OutputFormat.Detailed;
  config.requestWordLevelTimestamps();
  push=SpeechSDK.AudioInputStream.createPushStream(SpeechSDK.AudioStreamFormat.getWaveFormatPCM(rate,16,1));
  recognizer=new SpeechSDK.SpeechRecognizer(config,SpeechSDK.AudioConfig.fromStreamInput(push));
  recognizer.recognizing=(_,e)=>{if(currentRun!==run)return;receive(e.result,false,run.start/rate);$('partial').textContent='途中認識中'};
  recognizer.recognized=(_,e)=>{if(currentRun!==run)return;if(e.result.reason===SpeechSDK.ResultReason.RecognizedSpeech)receive(e.result,true,run.start/rate);$('partial').textContent='発話を待っています'};

$('stop').onclick=()=>stop();
const blockStarts=[];
function clip(begin,finish){
 const start=Math.max(0,Math.round(begin*rate)),stop=Math.min(total,Math.round(finish*rate));

 const header=new ArrayBuffer(44),v=new DataView(header);
